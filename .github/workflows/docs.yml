name: Documentation

on:
  push:
    branches:
      - develop
    tags: '*'
  pull_request:
    branches:
      - '*'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Check that CHANGELOG.md links are up to date
        run: |
          julia --project=docs/ -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs/ -e 'using Changelog; Changelog.generate(Changelog.CommonMark(), "CHANGELOG.md"; repo="RimuQMC/Rimu.jl")'
          git diff --exit-code CHANGELOG.md || (echo "::error::CHANGELOG.md links are out of date. Run 'make changelog' and commit the result." && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: |
          export JULIA_PROJECT=@.
          export JULIA_MPIEXEC=/tmp/mpiexecwrapper
          echo -e '#!/bin/bash\nmpiexec --allow-run-as-root $@' > $JULIA_MPIEXEC
          chmod +x $JULIA_MPIEXEC
          julia -e 'println(ENV)'
          julia -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
          julia --project=docs/ -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --project=docs/ -e 'using Rimu'
      - name: Build and deploy
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GKSwstype: "100" # https://discourse.julialang.org/t/generation-of-documentation-fails-qt-qpa-xcb-could-not-connect-to-display/60988
        run: julia --project=docs/ docs/make.jl
